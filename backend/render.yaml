services:
  - type: web
    name: ceeco-marketing-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py makemigrations marketing && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ceeco-marketing-ai-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1

databases:
  - name: ceeco-marketing-ai-db
    databaseName: ceeco_marketing
    user: ceeco_marketing_user
    plan: free
    region: singapore
